:root {
  --bg-top: #ffb648;
  --bg-mid: #ff8a33;
  --bg-bottom: #f2602e;
  --ink: #4a2a12;
  --bubble: #fff6e6;
  --heart: #e8344e;
  --f: "Monocraft", "Courier New", monospace;
  color-scheme: light;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0;
  min-height: 100%;
  background: linear-gradient(170deg, var(--bg-top) 0%, var(--bg-mid) 50%, var(--bg-bottom) 100%) fixed, var(--bg-mid);
  color: var(--ink);
  font-family: var(--f);
  padding: 24px 16px;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow-x: hidden;
}
button { font-family: var(--f); }

.stage { width: 100%; max-width: 380px; display: flex; flex-direction: column; align-items: center; gap: 18px; position: relative; }

/* Bocadillo con esquinas pixeladas */
.bubble-slot { width: 100%; height: 9.2em; display: flex; align-items: flex-end; font-size: 19px; }
.bubble {
  position: relative; width: 100%;
  background: var(--bubble);
  padding: 14px 16px;
  line-height: 1.45;
  box-shadow: 0 -4px 0 var(--ink), 0 4px 0 var(--ink), -4px 0 0 var(--ink), 4px 0 0 var(--ink), 8px 8px 0 rgba(74,42,18,.25);
  overflow-wrap: anywhere;
}
.bubble::after {
  content: ""; position: absolute; left: 50%; bottom: -16px; width: 12px; height: 12px; margin-left: -6px;
  background: var(--bubble);
  box-shadow: 4px 0 0 var(--ink), -4px 0 0 var(--ink), 0 4px 0 var(--ink);
}
.bubble p { margin: 0; min-height: 1.45em; }
.caret { display: inline-block; width: .5em; animation: blink 1s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0; } }

/* Pollito */
.chick-wrap { position: relative; }
.chick {
  display: block; padding: 0; border: 0; background: none; cursor: pointer;
  width: min(62vw, 270px);
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
  -webkit-user-select: none; user-select: none;
}
.chick:focus-visible { outline: 4px dashed var(--ink); outline-offset: 6px; }
.chick canvas, .chick img { display: block; width: 100%; height: auto; image-rendering: pixelated; image-rendering: crisp-edges; }
.chick.idle { animation: bob 1.1s steps(2) infinite; }
.chick.hop { animation: hop .28s steps(3); }
@keyframes bob { 50% { transform: translateY(-5px); } }
@keyframes hop { 50% { transform: translateY(-16px); } }

.num {
  position: absolute; top: 48%; font-size: 34px; font-weight: 700; color: var(--bubble);
  text-shadow: 3px 3px 0 var(--ink); pointer-events: none;
}
.num.l { left: -8%; }
.num.r { right: -8%; }

.hint { font-size: 14px; opacity: .75; margin: 0; }
.mute {
  position: fixed; top: calc(12px + env(safe-area-inset-top, 0px)); right: 12px;
  font-size: 13px; color: var(--ink); background: var(--bubble); border: 0; padding: 6px 10px; cursor: pointer;
  box-shadow: 0 -3px 0 var(--ink), 0 3px 0 var(--ink), -3px 0 0 var(--ink), 3px 0 0 var(--ink);
}
.mute:focus-visible { outline: 3px dashed var(--ink); outline-offset: 4px; }

.heart.notita { color: #fff7e0; font-size: 24px; }
.heart { position: absolute; font-size: 26px; color: var(--heart); text-shadow: 2px 2px 0 var(--ink); pointer-events: none; animation: rise 1.4s steps(8) forwards; }
@keyframes rise { to { transform: translateY(-120px); opacity: 0; } }

.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

@media (max-width: 400px) { .bubble-slot { font-size: 17px; height: 10em; } }
@media (prefers-reduced-motion: reduce) {
  .chick.idle, .chick.hop, .caret { animation: none; }
  .heart { display: none; }
}
</style>

const $ = id => document.getElementById(id);
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;

/* ---------- Pollito en pixel art ---------- */
const W = 36, H = 38;
const C = {
  line: "#4a2a12", body: "#ffd43b", belly: "#fff0a8", wing: "#f5b82e",
  foot: "#ff8c1a", orange: "#ff8a1f", orangeShade: "#e0620e", orangeHi: "#ffc884",
  leaf: "#5cbf4a", leafDk: "#2f7d32", stem: "#6b4a1e",
  eye: "#2a1a10", white: "#ffffff", cheek: "#ff9e9e", mouth: "#8a2a1a"
};
const st = { blink: false, mouth: false, wl: 0, wr: 0, angry: false };
const g = $("cv").getContext("2d");

function draw() {
  const px = Array.from({ length: H }, () => new Array(W).fill(null));
  const set = (x, y, c) => { if (y >= 0 && y < H && x >= 0 && x < W) px[y][x] = c; };
  const ell = (cx, cy, rx, ry, c, test) => {
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
      const dx = (x + .5 - cx) / rx, dy = (y + .5 - cy) / ry;
      if (dx * dx + dy * dy <= 1 && (!test || test(x, y))) px[y][x] = c;
    }
  };
  const oell = (cx, cy, rx, ry, c) => { ell(cx, cy, rx + 1, ry + 1, C.line); ell(cx, cy, rx, ry, c); };
  const rect = (x0, y0, w, h, c) => { for (let y = y0; y < y0 + h; y++) for (let x = x0; x < x0 + w; x++) set(x, y, c); };

  // patitas
  rect(12, 32, 5, 6, C.line); rect(13, 33, 3, 4, C.foot);
  rect(19, 32, 5, 6, C.line); rect(20, 33, 3, 4, C.foot);
  // alas
  oell(7, 25 + st.wl, 2.6, 4, C.wing);
  oell(29, 25 + st.wr, 2.6, 4, C.wing);
  // cuerpo y barriga
  oell(18, 24, 10.5, 9.5, C.body);
  ell(18, 28.5, 6.5, 4.8, C.belly);
  // naranja en la cabeza
  oell(18, 10, 5.2, 4.6, C.orange);
  ell(18, 10, 5.2, 4.6, C.orangeShade, (x, y) => (x - 18) + (y - 10) * 1.2 > 3.5);
  set(15, 7, C.orangeHi); set(16, 7, C.orangeHi); set(15, 8, C.orangeHi);
  set(18, 4, C.stem); set(18, 3, C.stem);
  set(19, 3, C.leaf); set(20, 3, C.leaf); set(21, 3, C.leafDk);
  set(19, 2, C.leafDk); set(20, 2, C.leafDk);
  // ojos
  for (const ex of [13, 22]) {
    if (st.blink) { rect(ex - 1, 22, 4, 1, C.eye); }
    else { rect(ex, 20, 2, 3, C.eye); set(ex, 20, C.white); }
  }
  // mofletes
  rect(10, 24, 2, 1, C.cheek); rect(25, 24, 2, 1, C.cheek);
  // enfadado: cejas, mofletes rojos y la marca de enfado
  if (st.angry) {
    for (const [x, y] of [[11, 17], [12, 18], [13, 18], [14, 19], [25, 17], [24, 18], [23, 18], [22, 19]]) set(x, y, C.line);
    rect(9, 24, 3, 2, "#ff5a5a"); rect(25, 24, 3, 2, "#ff5a5a");
    for (const [x, y] of [[27, 13], [29, 13], [28, 14], [27, 15], [29, 15], [26, 12], [30, 12], [26, 16], [30, 16]]) set(x, y, "#e8344e");
  }
  // pico
  rect(16, 23, 4, 1, C.foot);
  if (st.mouth) { rect(17, 24, 2, 1, C.mouth); rect(17, 25, 2, 1, C.foot); }
  else { rect(17, 24, 2, 1, C.foot); }

  g.clearRect(0, 0, W, H);
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    if (px[y][x]) { g.fillStyle = px[y][x]; g.fillRect(x, y, 1, 1); }
  }
}
draw();
$("still").hidden = true;
$("cv").hidden = false;

// parpadeo
(function blinkLoop() {

    st.blink = true; draw();

  }, 2200 + Math.random() * 2500);
})();

/* ---------- Voz tipo balbuceo ---------- */
let ac = null, master = null, muted = false;
function audio() {
  if (!ac) {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return null;
    ac = new AC();
    master = ac.createGain(); master.gain.value = 0.5; master.connect(ac.destination);
  }
  if (ac.state === "suspended") ac.resume();
  desbloquearIOS();
  return ac;
}
// En iPhone, el interruptor de silencio apaga este tipo de audio.
// Esto le pide al sistema que lo trate como reproducción normal.
let iosListo = false;
function desbloquearIOS() {
  if (iosListo) return;
  iosListo = true;
  try { if (navigator.audioSession) navigator.audioSession.type = "playback"; } catch (e) {}
  try {
    const sr = 8000, n = 800, buf = new ArrayBuffer(44 + n), v = new DataView(buf);
    const w = (o, s) => [...s].forEach((c, i) => v.setUint8(o + i, c.charCodeAt(0)));
    w(0, "RIFF"); v.setUint32(4, 36 + n, true); w(8, "WAVE"); w(12, "fmt ");
    v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
    v.setUint32(24, sr, true); v.setUint32(28, sr, true); v.setUint16(32, 1, true); v.setUint16(34, 8, true);
    w(36, "data"); v.setUint32(40, n, true);
    for (let i = 0; i < n; i++) v.setUint8(44 + i, 128);
    const a = new Audio(URL.createObjectURL(new Blob([buf], { type: "audio/wav" })));
    a.loop = true; a.setAttribute("playsinline", "");
    const p = a.play(); if (p && p.catch) p.catch(() => {});
  } catch (e) {}
}
/* Cada letra suena como una sílaba corta: la consonante y la vocal de su palabra.
   Así el balbuceo se parece a lo que dice la frase, sin llegar a ser voz real. */
const VOC = { a: [800, 1250], e: [480, 1950], i: [310, 2350], o: [500, 880], u: [330, 760] };
const GVOC = { a: 1, e: 1, i: 1.6, o: 1.1, u: 1.6 };
const ACENTOS = { "á": "a", "é": "e", "í": "i", "ó": "o", "ú": "u", "ü": "u" };
const DIGITO = ["o", "u", "o", "e", "a", "i", "e", "e", "o", "e"];
const CONS = {
  p: { n: 900, burst: 1 },  b: { n: 700, burst: 1, v: 1 },
  t: { n: 3800, burst: 1 }, d: { n: 3000, burst: 1, v: 1 },
  k: { n: 2000, burst: 1 }, c: { n: 2000, burst: 1 }, q: { n: 2000, burst: 1 }, g: { n: 1600, burst: 1, v: 1 },
  s: { n: 6500, fric: 1 },  z: { n: 5500, fric: 1 }, f: { n: 3800, fric: 1 }, x: { n: 5000, fric: 1 },
  j: { n: 2200, fric: 1 },  h: { n: 1800, fric: 1, soft: 1 }, v: { n: 3000, fric: 1, soft: 1, v: 1 },
  m: { nasal: [250, 1100] }, n: { nasal: [270, 1500] }, "ñ": { nasal: [280, 2000] },
  l: { liq: [360, 1250] },   r: { liq: [450, 1400] },
  y: { liq: [300, 2300] },   w: { liq: [320, 700] }
};
const ruidos = new WeakMap();
function ruido(ctx) {
  let b = ruidos.get(ctx);
  if (!b) {
    b = ctx.createBuffer(1, Math.ceil(ctx.sampleRate * 0.15), ctx.sampleRate);
    const d = b.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    ruidos.set(ctx, b);
  }
  return b;
}
function silaba(ctx, dest, ch, vocal, f0, t) {
  const k = ch.toLowerCase();
  const vk = ACENTOS[k] || k;
  const dig = /[0-9]/.test(k);
  const esVocal = !!VOC[vk];
  const vq = VOC[esVocal ? vk : dig ? DIGITO[+k] : vocal] ? (esVocal ? vk : dig ? DIGITO[+k] : vocal) : "a";
  const v = VOC[vq], vg = GVOC[vq];
  const cons = (esVocal || dig) ? null : (CONS[k] || null);
  const sonora = !!cons && !!(cons.nasal || cons.liq || cons.v);

  const cd = !cons ? 0 : cons.fric ? 0.04 : cons.burst ? 0.02 : 0.035;
  const total = cd + (cons ? 0.065 : 0.1);

  // voz: dientes de sierra que pasan por dos o tres filtros de vocal
  const o = ctx.createOscillator(); o.type = "sawtooth";
  o.frequency.setValueAtTime(f0 * 1.06, t);
  o.frequency.exponentialRampToValueAtTime(f0 * 0.96, t + total);

  const env = ctx.createGain();
  const ini = sonora ? t : t + cd;
  env.gain.setValueAtTime(0.0001, t);
  env.gain.setValueAtTime(0.0001, ini);
  env.gain.exponentialRampToValueAtTime((sonora ? 0.4 : 1) * vg, ini + 0.012);
  if (sonora) env.gain.exponentialRampToValueAtTime(vg, t + cd + 0.015);
  env.gain.exponentialRampToValueAtTime(0.0001, t + total);

  const loc = cons && (cons.nasal || cons.liq);
  const desde = loc || [v[0] * 0.85, v[1] * 0.92];
  for (const [a, b, q, gan] of [[desde[0], v[0], 7, 1], [desde[1], v[1], 10, 0.7], [2900, 2900, 8, 0.25]]) {
    const bp = ctx.createBiquadFilter(); bp.type = "bandpass"; bp.Q.value = q;
    bp.frequency.setValueAtTime(a, t);
    bp.frequency.linearRampToValueAtTime(b, t + cd + 0.025);
    const gv = ctx.createGain(); gv.gain.value = gan;
    o.connect(bp).connect(gv).connect(env);
  }
  env.connect(dest);
  o.start(t); o.stop(t + total + 0.03);

  // consonantes que silban o explotan: un golpecito de ruido
  if (cons && (cons.burst || cons.fric)) {
    const ns = ctx.createBufferSource(); ns.buffer = ruido(ctx);
    const nf = ctx.createBiquadFilter();
    nf.type = cons.n > 4000 ? "highpass" : "bandpass";
    nf.frequency.value = cons.n; nf.Q.value = cons.n > 4000 ? 0.7 : 1.4;
    const ng = ctx.createGain();
    const dur = cons.burst ? 0.022 : cons.soft ? 0.04 : 0.05;
    const nivel = RUIDO * (cons.soft ? 0.5 : cons.fric ? 1 : 1.6);
    ng.gain.setValueAtTime(0.0001, t);
    ng.gain.exponentialRampToValueAtTime(nivel, t + 0.004);
    ng.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    ns.connect(nf).connect(ng).connect(dest);
    ns.start(t); ns.stop(t + dur + 0.02);
  }
}
const RUIDO = 0.3;

// la vocal que acompaña a cada consonante: la siguiente de su palabra
function vocalDe(text, i) {
  for (let j = i + 1; j < text.length && text[j] !== " "; j++) {
    const c = text[j].toLowerCase(), c2 = ACENTOS[c] || c;
    if (VOC[c2]) return c2;
  }
  for (let j = i - 1; j >= 0 && text[j] !== " "; j--) {
    const c = text[j].toLowerCase(), c2 = ACENTOS[c] || c;
    if (VOC[c2]) return c2;
  }
  return "a";
}
// el tono sube un poco al empezar cada palabra, baja hacia el final y sube si es pregunta
function planTono(text) {
  const base = 470 + Math.random() * 150;
  const n = text.length, pregunta = /\?\s*$/.test(text);
  let paseo = 0;
  return Array.from(text, (_, i) => {
    paseo = (paseo + (Math.random() - 0.5) * 0.1) * 0.85;
    let m = 1 + paseo - 0.1 * (i / Math.max(1, n - 1));
    if (i === 0 || text[i - 1] === " ") m *= 1.09;
    if (pregunta && i > n - 7) m *= 1 + (i - (n - 7)) * 0.04;
    return base * m;
  });
}
function habla(text, i, tonos) {
  if (muted || !ac) return;
  silaba(ac, master, text[i], vocalDe(text, i), tonos[i], ac.currentTime);
}

/* ---------- Cantar ----------
   Algunas frases se cantan: cada sílaba es una nota sostenida con un poco de vibrato.
   La melodía es propia (una frase corta que sube y baja). */
const CANCIONES = {
  "un cielito anaranjao...": {
    silabas: ["un ", "cie", "li", "to ", "a", "na", "ran", "jao..."],
    notas:   [7, 9, 7, 4, 2, 4, 5, 4],
    tiempos: [1, 1, 1, 2, 1, 1, 1, 4],
    pulso: 0.24
  }
};
let voz = null;
function nota(ctx, dest, vocal, f0, t, dur, caida) {
  const v = VOC[vocal] || VOC.a, vg = GVOC[vocal] || 1;
  const o = ctx.createOscillator(); o.type = "sawtooth";
  o.frequency.setValueAtTime(f0 * 0.97, t);
  o.frequency.linearRampToValueAtTime(f0, t + 0.04);
  if (caida) { o.frequency.setValueAtTime(f0, t + dur * 0.45); o.frequency.exponentialRampToValueAtTime(f0 * 0.75, t + dur); }
  // vibrato que entra poco a poco
  const lfo = ctx.createOscillator(), lg = ctx.createGain();
  lfo.frequency.value = 5.6; lg.gain.setValueAtTime(0, t); lg.gain.linearRampToValueAtTime(f0 * 0.025, t + Math.min(0.3, dur));
  lfo.connect(lg).connect(o.frequency);
  const env = ctx.createGain();
  env.gain.setValueAtTime(0.0001, t);
  env.gain.exponentialRampToValueAtTime(0.8 * vg, t + 0.03);
  env.gain.setValueAtTime(0.8 * vg, t + dur * 0.7);
  env.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  for (const [f, q, gan] of [[v[0], 7, 1], [v[1], 10, 0.7], [2900, 8, 0.25]]) {
    const bp = ctx.createBiquadFilter(); bp.type = "bandpass"; bp.frequency.value = f; bp.Q.value = q;
    const gv = ctx.createGain(); gv.gain.value = gan;
    o.connect(bp).connect(gv).connect(env);
  }
  env.connect(dest);
  o.start(t); lfo.start(t); o.stop(t + dur + 0.05); lfo.stop(t + dur + 0.05);
}
function notitas() {
  if (reduce) return;
  const wrap = document.querySelector(".chick-wrap");
  const h = document.createElement("span");
  h.className = "heart notita"; h.textContent = Math.random() < 0.5 ? "♪" : "♫";
  h.style.left = (20 + Math.random() * 60) + "%";
  h.style.top = (5 + Math.random() * 25) + "%";
  wrap.appendChild(h);
  setTimeout(() => h.remove(), 1600);
}
function cantar(texto, c) {
  clearTimeout(typing);
  fullText = texto;
  $("live").textContent = texto;
  $("caret").hidden = true;
  const el = $("text"); el.textContent = "";
  let t0 = 0, dest = null;
  if (!muted && ac) {
    dest = ac.createGain(); dest.connect(master); voz = dest;
    t0 = ac.currentTime + 0.05;
    const base = 520;
    let t = t0;
    c.silabas.forEach((sil, k) => {
      const dur = c.tiempos[k] * c.pulso;
      const vocs = [...sil.toLowerCase()].map(x => ACENTOS[x] || x).filter(x => VOC[x]);
      const f0 = base * Math.pow(2, c.notas[k] / 12);
      const ini = sil.trim()[0];
      if (ini && !VOC[ACENTOS[ini] || ini]) silaba(ac, dest, ini, vocs[0] || "a", f0, t);
      nota(ac, dest, vocs[vocs.length - 1] || "a", f0, t + 0.03, dur - 0.02, k === c.silabas.length - 1);
      t += dur;
    });
  }
  let k = 0;
  const paso = () => {
    if (k >= c.silabas.length) {
      st.mouth = false; st.wl = st.wr = 0; draw();
      $("caret").hidden = false; typing = null; voz = null;
      return;
    }
    el.textContent += c.silabas[k];
    st.mouth = true; const lado = k % 2 ? 1 : -1; st.wl = 2 * lado; st.wr = -2 * lado; draw();
    if (k % 2 === 0) notitas();
    const dur = c.tiempos[k] * c.pulso * 1000;
    typing = setTimeout(() => { st.mouth = false; draw(); typing = setTimeout(paso, 40); }, dur - 40);
    k++;
  };
  paso();
}

/* ---------- Escribir la frase ---------- */
let typing = null, fullText = "hazme clic";
function say(text) {
  clearTimeout(typing);
  fullText = text;
  $("live").textContent = text;
  $("caret").hidden = true;
  const el = $("text");
  el.textContent = "";
  let i = 0;
  const tonos = planTono(text);
  const step = () => {
    if (i >= text.length) {
      st.mouth = false; draw();
      $("caret").hidden = false;
      typing = null;
      return;
    }
    const ch = text[i++];
    el.textContent += ch;
    let wait = 56;
    if (/[a-záéíóúüñ0-9]/i.test(ch)) { habla(text, i - 1, tonos); st.mouth = !st.mouth; draw(); }
    else if (ch === " ") { wait = 40; }
    else if (/[,.?!…:]/.test(ch)) { wait = 160; st.mouth = false; draw(); }
    typing = setTimeout(step, wait);
  };
  step();
}
function finishNow() {
  clearTimeout(typing); typing = null;
  if (voz && ac) { voz.gain.setTargetAtTime(0, ac.currentTime, 0.03); voz = null; }
  st.wl = st.wr = 0;
  $("text").textContent = fullText;
  st.mouth = false; draw();
  $("caret").hidden = false;
}

/* ---------- Frases al azar sin repetir ---------- */
let bolsa = [], ultima = null;
function siguiente() {
  if (!bolsa.length) {
    bolsa = FRASES.slice();
    for (let i = bolsa.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [bolsa[i], bolsa[j]] = [bolsa[j], bolsa[i]];
    }
    if (bolsa[bolsa.length - 1] === ultima) bolsa.unshift(bolsa.pop());
  }
  ultima = bolsa.pop();
  return ultima;
}

/* ---------- 6-7 con las alas ---------- */
let sixTimer = null;
function seisSiete() {
  clearInterval(sixTimer);
  const n6 = $("n6"), n7 = $("n7");
  n6.hidden = n7.hidden = false;
  let k = 0;
  sixTimer = setInterval(() => {
    const up = k % 2 === 0;
    st.wl = up ? -5 : 1; st.wr = up ? 1 : -5;
    n6.style.transform = `translateY(${up ? -18 : 6}px)`;
    n7.style.transform = `translateY(${up ? 6 : -18}px)`;
    draw();
    if (++k > 13) {
      clearInterval(sixTimer);
      st.wl = st.wr = 0; draw();
      n6.hidden = n7.hidden = true;
    }
  }, 210);
}
function pararSeisSiete() {
  clearInterval(sixTimer);
  st.wl = st.wr = 0;
  $("n6").hidden = $("n7").hidden = true;
}

/* ---------- Corazones ---------- */
function corazones() {
  if (reduce) return;
  const wrap = document.querySelector(".chick-wrap");
  for (let i = 0; i < 5; i++) {
    const h = document.createElement("span");
    h.className = "heart"; h.textContent = "♥";
    h.style.left = (15 + Math.random() * 70) + "%";
    h.style.top = (10 + Math.random() * 30) + "%";
    h.style.animationDelay = (i * 0.12) + "s";
    wrap.appendChild(h);
    setTimeout(() => h.remove(), 2200);
  }
}

/* ---------- Clic ---------- */
const chick = $("chick");
let clics = 0;
chick.addEventListener("click", () => {
  audio();
  if (typing) { finishNow(); return; }
  clics++;
  $("hint").textContent = clics === 1 ? "sigue haciéndome clic" : "♥ " + clics;
  if (!reduce) {
    chick.classList.remove("idle", "hop"); void chick.offsetWidth; chick.classList.add("hop");
  }
  pararSeisSiete();
  const frase = siguiente();
  if (CANCIONES[frase]) cantar(frase, CANCIONES[frase]); else say(frase);
  if (frase.includes("6-7")) seisSiete();
  if (CON_CORAZONES.test(frase)) corazones();
});
chick.addEventListener("animationend", e => {

  const norm = s => String(s).toLowerCase().replace(/['’]/g, "").normalize("NFD").replace(/[̀-ͯ]/g, "")
    .replace(/⅔/g, " 2/3 ").replace(/⅗/g, " 3/5 ").replace(/[^a-z0-9/. ]+/g, " ");
  const raiz = w => /^\d/.test(w) ? w : /^(muer|muri|falle)/.test(w) ? "muert" : (w.length > 5 ? w.slice(0, 5) : (w.replace(/(es|s)$/, "") || w));
  function palabras(s) {
    return norm(s).split(/\s+/).map(w => w.replace(/^\.+|\.+$/g, ""))
      .filter(w => w && !STOP.has(w) && (w.length > 1 || /\d/.test(w))).map(raiz);
  }
  // sinónimos y abreviaturas (por raíz)
  const GRUPOS = [
    ["dura", "durac", "duran", "durar", "duro", "tiemp", "perio", "dias", "plazo"],
    ["edad", "mayor", "ano"],
    ["elige", "elegi", "elecc", "elegir", "nombr", "desig"],
    ["desti", "remov", "remue", "quita", "echar"],
    ["requi", "exige", "condi"],
    ["an", "asamb", "parla"],
    ["tsj", "tribu", "supre"],
    ["cne", "elect", "rector"],
    ["vp", "vicep"],
    
    ["censu", "mocio"],
    ["inmun", "invio", "irres"],
    ["minis", "gabin"],
    ["fisca", "minis"],
    ["contr", "contra"],
    ["exced", "excep", "alarm"],
    ["mayor", "2/3", "3/5"],
    ["muert", "falta", "absol", "renun"]
  ];
  const SIN = {};
  for (const g of GRUPOS) for (const w of g) { SIN[w] = SIN[w] || new Set(); g.forEach(x => x !== w && SIN[w].add(x)); }

  let docs = null, idf = null;
  function indexar(temas) {
    docs = [];
    temas.forEach(t => t.q.forEach((q, i) => {
      const pesos = new Map();
      const sumar = (txt, w) => palabras(txt).forEach(p => pesos.set(p, Math.max(pesos.get(p) || 0, w)));
      sumar(t.nombre, 0.5); sumar(q[2], 1); sumar(q[1][0], 1.5); sumar(q[0], 2);
      docs.push({ t, i, q, pesos, enPregunta: new Set(palabras(q[0])) });
    }));
    const df = new Map();
    docs.forEach(d => d.pesos.forEach((_, p) => df.set(p, (df.get(p) || 0) + 1)));
    idf = new Map();
    df.forEach((n, p) => idf.set(p, Math.log(1 + docs.length / n)));
  }
  function buscar(texto, temas) {
    if (!docs) indexar(temas);
    const base = [...new Set(palabras(texto))];
    if (!base.length) return { vacia: true, res: [] };
    const res = docs.map(d => {
      let s = 0, hits = 0;
      for (const p of base) {
        const w = d.pesos.get(p);
        if (w) { s += (idf.get(p) || 0) * w; hits++; continue; }
        let mejor = 0;
        (SIN[p] || []).forEach(x => { const wx = d.pesos.get(x); if (wx) mejor = Math.max(mejor, 0.6 * wx * (idf.get(x) || 0)); });
        if (mejor) { s += mejor; hits += 0.6; }
      }
      let enQ = 0; base.forEach(p => { if (d.enPregunta.has(p)) enQ++; else if ([...(SIN[p] || [])].some(x => d.enPregunta.has(x))) enQ += 0.6; });
      const ajuste = 1 + 0.5 * enQ / Math.max(1, d.enPregunta.size);
      return { d, s: s * (0.6 + 0.4 * hits / base.length) * ajuste, hits, cob: hits / base.length };
    }).filter(r => r.s > 0).sort((a, b) => b.s - a.s);
    return { base, res };
  }
  return { buscar, palabras, norm };
})();

    [/(te quiero|te amo|me gustas|te adoro|lindo|bello|cuchi)/, "yo también te quiero, pero ahora toca estudiar. ¡pío!"],
    [/(quien eres|como te llamas|que eres|eres una ia|eres real)/, "soy el pollito sabio. me sé la guía de Constitucional II de memoria, pero de lo demás no tengo ni idea."],
    [/(no se|no entiendo|ayuda|estoy perdida|que estudio)/, "tranqui. empieza por la primera parte del examen y pregúntame lo que no te quede claro. ¡pío!"]
  ];
  function vistaChat() {
    caja.innerHTML = cabeza(`<button class="qz-x" data-a="temas">← temas</button>`) + `
      <div class="qz-chat" id="qzChat" aria-live="polite"></div>
      <div class="qz-sug">${SUGERENCIAS.map(s => `<button type="button" data-a="sug">${esc(s)}</button>`).join("")}</div>
      <form class="qz-form" id="qzForm" autocomplete="off">
        <label class="sr" for="qzInput">Tu pregunta</label>
        <input id="qzInput" type="text" maxlength="200" placeholder="escribe tu pregunta…" enterkeyhint="send">
        <button type="submit" class="qz-next">preguntar</button>
      </form>
      <p class="qz-nota">el pollito solo sabe lo que hay en la guía. si no lo encuentra, te lo dice.</p>`;
    const lista = document.getElementById("qzChat");
    if (!chat.length) chat.push({ pio: true, texto: "¡pío! soy el pollito sabio. escríbeme tu duda sobre la guía de Constitucional II y busco la respuesta." });
    chat.forEach(m => lista.appendChild(burbuja(m, false)));
    document.getElementById("qzForm").addEventListener("submit", e => {
      e.preventDefault();
      const inp = document.getElementById("qzInput");
      const v = inp.value.trim(); if (!v) return;
      inp.value = ""; preguntar(v);
    });
    qz.scrollTop = 0;
    if (matchMedia("(pointer: fine)").matches) document.getElementById("qzInput").focus({ preventScroll: true });
  }
  function burbuja(m, animar) {
    const el = document.createElement("div");
    if (!m.pio) {
      el.className = "qz-msg yo";
      el.innerHTML = `<p class="px">${esc(m.texto)}</p>`;
      return el;
    }
    el.className = "qz-msg pio";
    el.innerHTML = `<img class="qz-av" src="${pollitoImg}" alt="" width="36" height="38">
      <div class="px qz-bub">${m.sobre ? `<p class="qz-sobre">sobre: ${esc(m.sobre)}</p>` : ""}<p class="qz-resp"></p>
      <div class="qz-extra" ${animar ? "hidden" : ""}>${m.fuente ? `<p class="qz-fuente">${esc(m.fuente)}</p>` : ""}${m.alt ? `<button type="button" class="qz-otra" data-a="alt" data-t="${m.alt.t}" data-i="${m.alt.i}">¿o era esto? ${esc(m.alt.q)}</button>` : ""}</div></div>`;
    const p = el.querySelector(".qz-resp"), extra = el.querySelector(".qz-extra");
    if (!animar) { p.textContent = m.texto; return el; }
    escribir(p, m.texto, () => { extra.hidden = false; extra.scrollIntoView({ block: "nearest" }); });
    el.querySelector(".qz-bub").addEventListener("click", () => { if (p._fin) p._fin(); });
    return el;
  }
  function escribir(p, texto, fin) {
    const tonos = typeof planTono === "function" ? planTono(texto) : null;
    let i = 0, timer = null;
    const acabar = () => { clearTimeout(timer); p.textContent = texto; p._fin = null; fin(); };
    p._fin = acabar;
    const paso = () => {
      if (i >= texto.length) return acabar();
      const ch = texto[i]; p.textContent += ch;
      if (tonos && i % 2 === 0 && /[a-záéíóúüñ0-9]/i.test(ch)) {
        try { if (!muted && ac) silaba(ac, master, ch, vocalDe(texto, i), tonos[i], ac.currentTime); } catch (e) {}
      }
      i++;
      timer = setTimeout(paso, /[,.?!:]/.test(ch) ? 120 : 24);
    };
    paso();
  }
  function decir(m) {
    chat.push(m);
    const lista = document.getElementById("qzChat"); if (!lista) return;
    const el = burbuja(m, true); lista.appendChild(el);
    el.scrollIntoView({ block: "end", behavior: sinMov ? "auto" : "smooth" });
  }
  const mayus = s => s.charAt(0).toUpperCase() + s.slice(1);
  function contestarDoc(t, i, intro) {
    const q = t.q[i], resp = q[1][0];
    decir({ pio: true, sobre: q[0], texto: (intro ? intro + " " : "") + mayus(resp) + (/[.?!]$/.test(resp) ? " " : ". ") + q[2], fuente: t.num + " · " + t.nombre });
  }
  function preguntar(texto) {
    try { if (typeof audio === "function") audio(); } catch (e) {}
    chat.push({ pio: false, texto });
    const lista = document.getElementById("qzChat");
    if (lista) { const el = burbuja({ pio: false, texto }, false); lista.appendChild(el); }
    const n = Sabio.norm(texto).trim();
    const { base, res } = Sabio.buscar(texto, TEMAS);
    const top = res[0];
    const seguro = top && top.s >= 6 && (top.cob >= 0.6 || (base && base.length === 1));
    setTimeout(() => {
      if (!seguro) {
        const charla = CHARLA.find(([re]) => re.test(n));
        if (charla) return decir({ pio: true, texto: charla[1] });
        decir({ pio: true, texto: "eso no lo encuentro en la guía. prueba a preguntarlo con otras palabras, por ejemplo: “¿quién elige a los rectores del CNE?”" });
        return;
      }
      const q = top.d.q, resp = q[1][0];
      const m = { pio: true, sobre: q[0], texto: mayus(resp) + (/[.?!]$/.test(resp) ? " " : ". ") + q[2], fuente: top.d.t.num + " · " + top.d.t.nombre };
      const seg = res[1];
      if (seg && seg.s >= 0.8 * top.s) m.alt = { t: seg.d.t.id, i: seg.d.i, q: seg.d.q[0] };
      decir(m);
    }, 350);
  }

  function abrir() {
    try {
      const cv = document.getElementById("cv");
      pollitoImg = cv.toDataURL();
      st.angry = true; st.blink = false; st.mouth = false; draw();
      pollitoEnfadado = cv.toDataURL();
      st.angry = false; draw();
    } catch (e) { if (typeof st !== "undefined") { st.angry = false; } }
    try { if (typeof audio === "function") audio(); } catch (e) {}
    qz.hidden = false;
    document.documentElement.style.overflow = "hidden";
    pintar(true);
  }
  function cerrar() {
    qz.hidden = true;
    document.documentElement.style.overflow = "";
    abrirBtn.focus();
  }
  abrirBtn.addEventListener("click", abrir);
})();
</script>
